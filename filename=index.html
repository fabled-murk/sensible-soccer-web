content=<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sensible Soccer Web</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Courier New', monospace; color: #fff; overflow: hidden; } #gameContainer { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; } #scoreboard { display: flex; align-items: center; gap: 20px; background: #16213e; border: 2px solid #0f3460; border-radius: 8px; padding: 8px 24px; font-size: 20px; font-weight: bold; letter-spacing: 2px; min-width: 320px; justify-content: center; } .team-red { color: #e94560; } .team-blue { color: #0fbcf9; } #scoreVal { font-size: 28px; color: #fff; min-width: 80px; text-align: center; } #timerDisplay { font-size: 14px; color: #aaa; text-align: center; } canvas { border: 3px solid #0f3460; border-radius: 4px; display: block; cursor: none; } #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.82); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; z-index: 10; } #overlay h1 { font-size: 42px; color: #e94560; text-shadow: 0 0 20px #e94560; margin-bottom: 4px; letter-spacing: 4px; } #overlay h2 { font-size: 26px; color: #0fbcf9; margin-bottom: 20px; } .ctrl-list { list-style: none; margin: 0 0 20px; text-align: center; } .ctrl-list li { margin: 4px 0; color: #aaa; font-size: 14px; } .ctrl-list span { color: #0fbcf9; font-weight: bold; } #startBtn { background: #e94560; color: #fff; border: none; padding: 14px 44px; font-size: 20px; font-family: 'Courier New', monospace; font-weight: bold; border-radius: 6px; cursor: pointer; letter-spacing: 3px; transition: all 0.2s; text-transform: uppercase; } #startBtn:hover { background: #c73652; transform: scale(1.05); box-shadow: 0 0 20px #e94560; } </style> </head> <body> <div id="gameContainer"> <div id="scoreboard"><span class="team-red">PLAYER</span><span id="scoreVal">0 - 0</span><span class="team-blue">CPU</span></div> <div id="timerDisplay">TIME: 3:00</div> <canvas id="gameCanvas" width="800" height="520"></canvas> <div id="overlay"> <h1>&#x26BD; SENSIBLE</h1> <h2>SOCCER WEB</h2> <ul class="ctrl-list"> <li><span>WASD / Arrows</span> &mdash; Move player</li> <li><span>SPACE</span> &mdash; Shoot toward goal</li> <li><span>SHIFT</span> &mdash; Sprint</li> <li><span>Q</span> &mdash; Pass to teammate</li> </ul> <p style="color:#ccc;font-size:14px;margin-bottom:20px">5 vs 5 top-down arcade soccer. Get close to ball to control it!</p> <button id="startBtn">KICK OFF!</button> </div> </div> <script> (function(){ 'use strict'; var W=800,H=520,PL=50,PR=750,PT=40,PB=480,PW=700,PH=440,CX=400,CY=260,GW=80,GD=16,GT=220,GB=300,PLAYER_R=10,BALL_R=7,GAME_DUR=180,FRICTION=0.978,BFRIC=0.985,SPD=2.8,SPRINT_M=1.55,SHOOT_POW=10,PASS_POW=6,CTRL_DIST=22; var canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'); var gameState='menu',score=[0,0],timeLeft=GAME_DUR,goalTimer=0,goalTeam=-1,particles=[]; var keys={}; document.addEventListener('keydown',function(e){keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0)e.preventDefault();}); document.addEventListener('keyup',function(e){keys[e.code]=false;}); var ball={x:CX,y:CY,vx:0,vy:0,owner:null}; var FORMS=[ [[PL+40,CY],[PL+130,CY-60],[PL+130,CY+60],[PL+230,CY-50],[PL+230,CY+50]], [[PR-40,CY],[PR-130,CY-60],[PR-130,CY+60],[PR-230,CY-50],[PR-230,CY+50]] ]; var players=[],selPlayer=null; function mkPlayers(){players=[];FORMS.forEach(function(team,ti){team.forEach(function(pos,pi){players.push({x:pos[0],y:pos[1],vx:0,vy:0,team:ti,idx:pi,isGK:pi===0,kcd:0,sprint:false});});});selPlayer=players.find(function(p){return p.team===0;});} function resetPos(){FORMS.forEach(function(team,ti){team.forEach(function(pos,pi){var p=players.find(function(pl){return pl.team===ti&&pl.idx===pi;});if(p){p.x=pos[0];p.y=pos[1];p.vx=0;p.vy=0;}});});ball.x=CX;ball.y=CY;ball.vx=0;ball.vy=0;ball.owner=null;selPlayer=players.find(function(p){return p.team===0;});} function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);} function norm(vx,vy){var m=Math.hypot(vx,vy);return m>0?[vx/m,vy/m]:[0,0];} function clamp(v,a,b){return Math.max(a,Math.min(b,v));} function closestToBall(team){var best=null,bd=Infinity;players.forEach(function(p){if(p.team!==team)return;var d=dist(p,ball);if(d<bd){bd=d;best=p;}});return best;} function spawnParticles(x,y){for(var i=0;i<60;i++){var a=Math.random()*Math.PI*2,s=2+Math.random()*6;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:0.014+Math.random()*0.016,size:3+Math.random()*4,color:'hsl('+Math.floor(Math.random()*360)+',100%,60%)'});}} function updateParticles(){particles=particles.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=p.decay;return p.life>0;});} function doKick(p,power,tx,ty){if(p.kcd>0)return;var d=norm(tx-p.x,ty-p.y);ball.vx=d[0]*power+p.vx*0.3;ball.vy=d[1]*power+p.vy*0.3;ball.owner=null;p.kcd=25;} function updateAI(dt){var chaser=closestToBall(1);players.filter(function(p){return p.team===1;}).forEach(function(p,i){var tx,ty,db=dist(p,ball);if(p.isGK){tx=PR-30;ty=clamp(ball.y,GT+12,GB-12);}else if(p===chaser){var steps=clamp(db/5,0,20);tx=ball.x+ball.vx*steps;ty=ball.y+ball.vy*steps;}else{var offs=[[-90,-65],[-90,65],[-170,0]],o=offs[i%offs.length]||[0,0];tx=clamp(ball.x-60+o[0],PL+60,PR-60);ty=clamp(ball.y+o[1],PT+20,PB-20);}var tdx=tx-p.x,tdy=ty-p.y,td=Math.hypot(tdx,tdy),isSprint=(p===chaser&&db<220);p.sprint=isSprint;var spd=SPD*(isSprint?SPRINT_M:1),react=isSprint?0.16:0.09;if(td>2){p.vx+=(tdx/td)*spd*react*60*(dt/1000);p.vy+=(tdy/td)*spd*react*60*(dt/1000);}var cs=Math.hypot(p.vx,p.vy);if(cs>spd){p.vx=(p.vx/cs)*spd;p.vy=(p.vy/cs)*spd;}if(p.kcd<=0&&db<CTRL_DIST+5&&(!ball.owner||ball.owner.team===0)){doKick(p,SHOOT_POW*0.88,PL-GD,CY+(Math.random()-0.5)*50);}});} function updatePlayers(dt){var isSprint=keys['ShiftLeft']||keys['ShiftRight'],spd=SPD*(isSprint?SPRINT_M:1);if(selPlayer&&gameState==='playing'){var p=selPlayer,mx=0,my=0;if(keys['ArrowLeft']||keys['KeyA'])mx-=1;if(keys['ArrowRight']||keys['KeyD'])mx+=1;if(keys['ArrowUp']||keys['KeyW'])my-=1;if(keys['ArrowDown']||keys['KeyS'])my+=1;if(mx||my){var n=norm(mx,my);p.vx=n[0]*spd;p.vy=n[1]*spd;}else{p.vx*=0.75;p.vy*=0.75;}if(keys['Space']){doKick(p,SHOOT_POW,PR+GD,CY+(Math.random()-0.5)*20);keys['Space']=false;}if(keys['KeyQ']){var mates=players.filter(function(pl){return pl.team===0&&pl!==p;});if(mates.length){var best=mates[0],bs=-Infinity;mates.forEach(function(tm){var sc=(tm.x-p.x)-dist(p,tm)*0.4;if(sc>bs){bs=sc;best=tm;}});doKick(p,PASS_POW,best.x,best.y);selPlayer=best;}keys['KeyQ']=false;}var cl=closestToBall(0);if(cl&&cl!==selPlayer&&dist(cl,ball)<dist(selPlayer,ball)-25)selPlayer=cl;}players.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vx*=FRICTION;p.vy*=FRICTION;p.x=clamp(p.x,PL+PLAYER_R,PR-PLAYER_R);p.y=clamp(p.y,PT+PLAYER_R,PB-PLAYER_R);players.forEach(function(o){if(o===p)return;var d=dist(p,o);if(d<PLAYER_R*2&&d>0){var ov=PLAYER_R*2-d,nv=norm(p.x-o.x,p.y-o.y);p.x+=nv[0]*ov*0.5;p.y+=nv[1]*ov*0.5;o.x-=nv[0]*ov*0.5;o.y-=nv[1]*ov*0.5;}});if(p.kcd>0)p.kcd--;});} function updateBall(){ball.vx*=BFRIC;ball.vy*=BFRIC;ball.x+=ball.vx;ball.y+=ball.vy;if(!ball.owner||ball.owner.kcd>0){ball.owner=null;var bd=CTRL_DIST,bp=null;players.forEach(function(p){if(p.kcd>0)return;var d=dist(p,ball);if(d<bd){bd=d;bp=p;}});if(bp)ball.owner=bp;}if(ball.owner){var p=ball.owner,cs=Math.hypot(p.vx,p.vy);if(cs>0.3){var nv=norm(p.vx,p.vy);ball.x=p.x+nv[0]*(PLAYER_R+BALL_R+2);ball.y=p.y+nv[1]*(PLAYER_R+BALL_R+2);}else{ball.x=p.x+(p.team===0?1:-1)*(PLAYER_R+BALL_R+2);ball.y=p.y;}ball.vx=p.vx;ball.vy=p.vy;}if(ball.y-BALL_R<PT){ball.y=PT+BALL_R;ball.vy=Math.abs(ball.vy)*0.7;}if(ball.y+BALL_R>PB){ball.y=PB-BALL_R;ball.vy=-Math.abs(ball.vy)*0.7;}if(ball.x-BALL_R<PL){if(ball.y>GT&&ball.y<GB){if(ball.x<PL-GD)triggerGoal(1);}else{ball.x=PL+BALL_R;ball.vx=Math.abs(ball.vx)*0.7;}}if(ball.x+BALL_R>PR){if(ball.y>GT&&ball.y<GB){if(ball.x>PR+GD)triggerGoal(0);}else{ball.x=PR-BALL_R;ball.vx=-Math.abs(ball.vx)*0.7;}}players.forEach(function(p){if(ball.owner===p)return;var d=dist(p,ball);if(d<PLAYER_R+BALL_R){var nv=norm(ball.x-p.x,ball.y-p.y);ball.x=p.x+nv[0]*(PLAYER_R+BALL_R+1);ball.y=p.y+nv[1]*(PLAYER_R+BALL_R+1);var rv=((ball.vx-p.vx)*nv[0]+(ball.vy-p.vy)*nv[1]);if(rv<0){ball.vx-=rv*nv[0]*1.4;ball.vy-=rv*nv[1]*1.4;}}});} function triggerGoal(team){if(goalTimer>0||gameState!=='playing')return;score[team]++;goalTeam=team;gameState='goal';goalTimer=200;spawnParticles(team===0?PR:PL,CY);document.getElementById('scoreVal').textContent=score[0]+' - '+score[1];} function drawPitch(){ctx.fillStyle='#2d6a2d';ctx.fillRect(0,0,W,H);var sw=PW/10;for(var i=0;i<10;i++){ctx.fillStyle=i%2===0?'#2d6a2d':'#317531';ctx.fillRect(PL+i*sw,PT,sw,PH);}ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2;ctx.strokeRect(PL,PT,PW,PH);ctx.beginPath();ctx.moveTo(CX,PT);ctx.lineTo(CX,PB);ctx.stroke();ctx.beginPath();ctx.arc(CX,CY,50,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(CX,CY,3,0,Math.PI*2);ctx.fill();ctx.strokeRect(PL,CY-90,100,180);ctx.strokeRect(PR-100,CY-90,100,180);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(PL+70,CY,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(PR-70,CY,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(80,80,80,0.8)';ctx.fillRect(PL-GD,GT,GD,GW);ctx.strokeRect(PL-GD,GT,GD,GW);ctx.fillRect(PR,GT,GD,GW);ctx.strokeRect(PR,GT,GD,GW);ctx.fillStyle='#fff';[[PL,GT],[PL,GB],[PR,GT],[PR,GB]].forEach(function(pt){ctx.beginPath();ctx.arc(pt[0],pt[1],4,0,Math.PI*2);ctx.fill();});[[PL,PT],[PR,PT],[PL,PB],[PR,PB]].forEach(function(pt){ctx.beginPath();ctx.arc(pt[0],pt[1],10,0,Math.PI*2);ctx.stroke();});} function drawPlayers(){players.forEach(function(p){var isSel=p===selPlayer,col=p.team===0?'#e94560':'#0fbcf9';if(isSel){ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.arc(p.x,p.y,PLAYER_R+5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(p.x+2,p.y+3,PLAYER_R,PLAYER_R*0.55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,PLAYER_R,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.isGK?'GK':(p.idx+1).toString(),p.x,p.y);if(p.sprint&&Math.random()>0.5){ctx.fillStyle='rgba(255,255,100,0.6)';ctx.beginPath();ctx.arc(p.x-p.vx*2,p.y-p.vy*2,2+Math.random()*2,0,Math.PI*2);ctx.fill();}});} function drawBall(){ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(ball.x+2,ball.y+4,BALL_R,BALL_R*0.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();var t=Date.now()/90;ctx.fillStyle='#222';for(var i=0;i<5;i++){var a=(i/5)*Math.PI*2+t;ctx.beginPath();ctx.arc(ball.x+Math.cos(a)*BALL_R*0.55,ball.y+Math.sin(a)*BALL_R*0.55,1.5,0,Math.PI*2);ctx.fill();}ctx.beginPath();ctx.arc(ball.x,ball.y,2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.stroke();} function drawParticles(){particles.forEach(function(p){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;} function drawHUD(){if(gameState==='goal'){ctx.save();ctx.globalAlpha=0.85;ctx.fillStyle='#000';ctx.fillRect(CX-160,CY-55,320,110);ctx.globalAlpha=1;ctx.fillStyle='#FFD700';ctx.font='bold 50px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GOAL!',CX,CY-15);ctx.fillStyle=goalTeam===0?'#e94560':'#0fbcf9';ctx.font='bold 20px Courier New';ctx.fillText((goalTeam===0?'PLAYER':'CPU')+' SCORES!',CX,CY+25);ctx.restore();}if(gameState==='ended'){ctx.save();ctx.globalAlpha=0.9;ctx.fillStyle='#000';ctx.fillRect(CX-180,CY-90,360,180);ctx.globalAlpha=1;ctx.fillStyle='#FFD700';ctx.font='bold 38px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';var msg=score[0]>score[1]?'YOU WIN!':score[1]>score[0]?'CPU WINS!':'DRAW!';ctx.fillText(msg,CX,CY-35);ctx.fillStyle='#fff';ctx.font='26px Courier New';ctx.fillText(score[0]+' - '+score[1],CX,CY+5);ctx.fillStyle='#aaa';ctx.font='15px Courier New';ctx.fillText('Press ENTER to play again',CX,CY+45);ctx.restore();}} function fmtTime(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;} var lastT=0; function loop(ts){var dt=Math.min(ts-lastT,50);lastT=ts;ctx.clearRect(0,0,W,H);drawPitch();if(gameState==='playing'){updatePlayers(dt);updateAI(dt);updateBall();timeLeft-=dt/1000;if(timeLeft<=0){timeLeft=0;gameState='ended';}document.getElementById('timerDisplay').textContent='TIME: '+fmtTime(timeLeft);drawParticles();drawPlayers();drawBall();drawHUD();}else if(gameState==='goal'){updateBall();updateParticles();goalTimer--;if(goalTimer<=0){gameState='playing';resetPos();}drawParticles();drawPlayers();drawBall();drawHUD();}else if(gameState==='ended'){updateParticles();drawParticles();drawPlayers();drawBall();drawHUD();}requestAnimationFrame(loop);} function startGame(){score=[0,0];timeLeft=GAME_DUR;particles=[];goalTimer=0;mkPlayers();resetPos();document.getElementById('scoreVal').textContent='0 - 0';document.getElementById('timerDisplay').textContent='TIME: 3:00';gameState='playing';document.getElementById('overlay').style.display='none';} document.getElementById('startBtn').addEventListener('click',startGame); document.addEventListener('keydown',function(e){if(e.code==='Enter'&&gameState==='ended')startGame();}); drawPitch();lastT=performance.now();requestAnimationFrame(loop); })(); </script> </body> </html>
