content=<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sensible Soccer Web</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Courier New', monospace; color: #fff; overflow: hidden; } #gameContainer { position: relative; } canvas { display: block; border: 3px solid #16213e; box-shadow: 0 0 40px rgba(0,200,100,0.3); } #ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; } #scoreboard { background: rgba(0,0,0,0.85); padding: 8px 20px; text-align: center; border-bottom: 2px solid #16213e; } #scoreboard h1 { font-size: 13px; color: #aaa; letter-spacing: 3px; } #scores { font-size: 28px; font-weight: bold; color: #fff; letter-spacing: 8px; text-shadow: 0 0 10px rgba(255,200,0,0.8); } #timer { font-size: 14px; color: #ffd700; } #controls-hint { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7); padding: 5px; text-align: center; font-size: 11px; color: #888; } #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.82); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; } #overlay h1 { font-size: 46px; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.8); margin-bottom: 6px; letter-spacing: 4px; } #overlay h2 { font-size: 22px; color: #fff; margin-bottom: 24px; } #overlay p { color: #aaa; margin: 4px 0; font-size: 14px; } .btn { margin-top: 20px; padding: 14px 40px; font-size: 18px; background: linear-gradient(135deg, #00b894, #00cec9); border: none; color: #fff; cursor: pointer; border-radius: 4px; font-family: 'Courier New', monospace; font-weight: bold; letter-spacing: 2px; transition: all 0.2s; pointer-events: all; } .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0,200,150,0.6); } .team-red { color: #ff6b6b; } .team-blue { color: #74b9ff; } </style> </head> <body> <div id="gameContainer"> <canvas id="gameCanvas"></canvas> <div id="ui"> <div id="scoreboard"> <h1>&#9917; SENSIBLE SOCCER WEB &#9917;</h1> <div id="scores"><span class="team-red" id="scoreHome">0</span> : <span class="team-blue" id="scoreAway">0</span></div> <div id="timer">03:00</div> </div> <div id="controls-hint">WASD / Arrows: Move &nbsp;|&nbsp; SPACE: Shoot/Tackle &nbsp;|&nbsp; SHIFT: Pass &nbsp;|&nbsp; P: Pause</div> </div> <div id="overlay"> <h1>&#9917; SENSIBLE SOCCER</h1> <h2>WEB EDITION</h2> <p><span class="team-red">&#9632; RED</span> vs <span class="team-blue">BLUE &#9632;</span></p> <p style="margin-top:14px; color:#ccc;">Controls:</p> <p><strong>WASD / Arrow Keys</strong> &mdash; Move player</p> <p><strong>SPACE</strong> &mdash; Shoot / Tackle</p> <p><strong>SHIFT</strong> &mdash; Pass to teammate</p> <p><strong>P</strong> &mdash; Pause game</p> <button class="btn" id="startBtn">KICK OFF!</button> </div> </div> <script> var W=900,H=600,PL=60,PR=840,PT=80,PB=540,GOAL_H=110,PR_=10,BR=7; var PS=3.2,AS=2.6,SP=13,PP=8,GT=180,TS=6,BF=0.985; var PW=PR-PL,PH=PB-PT,PCX=(PL+PR)/2,PCY=(PT+PB)/2; var GTOP=PCY-GOAL_H/2,GBOT=PCY+GOAL_H/2,GD=30; var canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'); canvas.width=W;canvas.height=H; var gc=document.getElementById('gameContainer');gc.style.width=W+'px';gc.style.height=H+'px'; function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);} function norm(vx,vy){var m=Math.hypot(vx,vy)||1;return[vx/m,vy/m];} function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));} function lerp(a,b,t){return a+(b-a)*t;} function rnd(lo,hi){return lo+Math.random()*(hi-lo);} var parts=[]; function spawnP(x,y,col,n){n=n||12;for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=rnd(1,5);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:col,r:rnd(2,5)});}} function tickP(){for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.92;p.vy*=0.92;p.life-=0.04;if(p.life<=0)parts.splice(i,1);}} function drawP(){parts.forEach(function(p){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;} var FMT=[[0.05,0.5],[0.22,0.28],[0.22,0.72],[0.42,0.35],[0.42,0.65],[0.65,0.5]]; function fpos(i,t){var f=FMT[i],fx=f[0],fy=f[1];if(t===1)fx=1-fx;return{x:PL+fx*PW,y:PT+fy*PH};} function Player(idx,team,human){ this.idx=idx;this.team=team;this.isHuman=human; var s=fpos(idx,team);this.x=s.x;this.y=s.y;this.vx=0;this.vy=0;this.kcd=0;this.ta=0; this.col=team===0?'#ff6b6b':'#74b9ff';this.shd=team===0?'#c0392b':'#2980b9'; this.dir=team===0?0:Math.PI; } Player.prototype.home=function(){return fpos(this.idx,this.team);}; Player.prototype.spd=function(){return this.isHuman?PS:AS;}; Player.prototype.mvTo=function(tx,ty,sp){var dx=tx-this.x,dy=ty-this.y,d=Math.hypot(dx,dy);if(d<0.5){this.vx=0;this.vy=0;return;}var s=Math.min(sp,d);this.vx=dx/d*s;this.vy=dy/d*s;}; Player.prototype.update=function(){ this.x=clamp(this.x+this.vx,PL+PR_,PR-PR_); this.y=clamp(this.y+this.vy,PT+PR_,PB-PR_); if(this.kcd>0)this.kcd--;if(this.ta>0)this.ta--; if(Math.hypot(this.vx,this.vy)>0.15)this.dir=Math.atan2(this.vy,this.vx); this.vx*=0.78;this.vy*=0.78; }; Player.prototype.draw=function(){ var x=this.x,y=this.y,r=PR_; ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x+2,y+4,r,r*0.45,0,0,Math.PI*2);ctx.fill(); if(this.ta>0){ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+6,0,Math.PI*2);ctx.stroke();} ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill(); ctx.strokeStyle=this.shd;ctx.lineWidth=2;ctx.stroke(); if(this.isHuman){ctx.strokeStyle='#ffd700';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,r+4,0,Math.PI*2);ctx.stroke();} var nx=x+Math.cos(this.dir)*(r-2),ny=y+Math.sin(this.dir)*(r-2); ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(nx,ny,2.5,0,Math.PI*2);ctx.fill(); ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(this.idx+1,x,y); }; function Ball(){this.reset();} Ball.prototype.reset=function(){this.x=PCX;this.y=PCY;this.vx=0;this.vy=0;this.owner=null;this.lk=null;this.ang=0;}; Ball.prototype.update=function(){ if(this.owner){var o=this.owner,tx=o.x+Math.cos(o.dir)*(PR_+BR+1),ty=o.y+Math.sin(o.dir)*(PR_+BR+1);this.x=lerp(this.x,tx,0.4);this.y=lerp(this.y,ty,0.4);this.vx=0;this.vy=0;return;} this.vx*=BF;this.vy*=BF; if(Math.abs(this.vx)<0.05)this.vx=0;if(Math.abs(this.vy)<0.05)this.vy=0; this.x+=this.vx;this.y+=this.vy;this.ang+=Math.hypot(this.vx,this.vy)*0.15; if(this.x-BR<PL){this.x=PL+BR;this.vx=Math.abs(this.vx)*0.65;} if(this.x+BR>PR){this.x=PR-BR;this.vx=-Math.abs(this.vx)*0.65;} if(this.y-BR<PT){this.y=PT+BR;this.vy=Math.abs(this.vy)*0.65;} if(this.y+BR>PB){this.y=PB-BR;this.vy=-Math.abs(this.vy)*0.65;} }; Ball.prototype.draw=function(){ var x=this.x,y=this.y,r=BR; ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x+2,y+3,r*0.9,r*0.42,0,0,Math.PI*2);ctx.fill(); ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill(); ctx.fillStyle='#222';ctx.save();ctx.translate(x,y);ctx.rotate(this.ang); for(var i=0;i<5;i++){var a=i/5*Math.PI*2;ctx.beginPath();ctx.arc(Math.cos(a)*r*0.45,Math.sin(a)*r*0.45,r*0.2,0,Math.PI*2);ctx.fill();} ctx.restore();ctx.strokeStyle='#bbb';ctx.lineWidth=0.8;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke(); }; function drawPitch(){ var g=ctx.createLinearGradient(PL,PT,PR,PB);g.addColorStop(0,'#2d8a4e');g.addColorStop(0.5,'#349958');g.addColorStop(1,'#2d8a4e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H); for(var i=0;i<10;i++){if(i%2===0){ctx.fillStyle='rgba(0,0,0,0.055)';ctx.fillRect(PL+i*(PW/10),PT,PW/10,PH);}} ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2;ctx.strokeRect(PL,PT,PW,PH); ctx.beginPath();ctx.moveTo(PCX,PT);ctx.lineTo(PCX,PB);ctx.stroke(); ctx.beginPath();ctx.arc(PCX,PCY,60,0,Math.PI*2);ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(PCX,PCY,4,0,Math.PI*2);ctx.fill(); ctx.strokeRect(PL,PCY-100,100,200);ctx.strokeRect(PR-100,PCY-100,100,200); ctx.strokeRect(PL,PCY-65,40,130);ctx.strokeRect(PR-40,PCY-65,40,130); ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(PL+65,PCY,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(PR-65,PCY,3,0,Math.PI*2);ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(PL-GD,GTOP,GD,GOAL_H); ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(PL,GTOP);ctx.lineTo(PL-GD,GTOP);ctx.lineTo(PL-GD,GBOT);ctx.lineTo(PL,GBOT);ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(PR,GTOP,GD,GOAL_H); ctx.beginPath();ctx.moveTo(PR,GTOP);ctx.lineTo(PR+GD,GTOP);ctx.lineTo(PR+GD,GBOT);ctx.lineTo(PR,GBOT);ctx.stroke(); ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=0.5; for(var j=0;j<=4;j++){var gy=GTOP+j*(GOAL_H/4);ctx.beginPath();ctx.moveTo(PL-GD,gy);ctx.lineTo(PL,gy);ctx.stroke();ctx.beginPath();ctx.moveTo(PR,gy);ctx.lineTo(PR+GD,gy);ctx.stroke();} for(var k=1;k<3;k++){ctx.beginPath();ctx.moveTo(PL-GD+k*(GD/3),GTOP);ctx.lineTo(PL-GD+k*(GD/3),GBOT);ctx.stroke();ctx.beginPath();ctx.moveTo(PR+k*(GD/3),GTOP);ctx.lineTo(PR+k*(GD/3),GBOT);ctx.stroke();} } var gst='menu',sc=[0,0],gt=0,gc2=0,gTeam=-1,ft=0,kot=0; var keys={},teams=[[],[]],ball=new Ball(),hp=null; function initGame(){teams=[[],[]];ball=new Ball();sc=[0,0];gt=0;parts.length=0;ft=0;for(var t=0;t<2;t++)for(var i=0;i<TS;i++)teams[t].push(new Player(i,t,t===0&&i===5));hp=teams[0][5];updUI();doKO();} function doKO(){ball.reset();teams.forEach(function(s){s.forEach(function(p,i){var h=fpos(i,p.team);p.x=h.x;p.y=h.y;p.vx=0;p.vy=0;});});kot=90;gst='kickoff';} document.addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='KeyP'){if(gst==='play')gst='paused';else if(gst==='paused')gst='play';}if(['Space','ShiftLeft','ShiftRight','ArrowUp','ArrowDown'].indexOf(e.code)>=0)e.preventDefault();}); document.addEventListener('keyup',function(e){keys[e.code]=false;}); function nMate(p){var b=null,bd=Infinity;teams[p.team].forEach(function(q){if(q===p)return;var d=dist(p,q);if(d<bd){bd=d;b=q;}});return b;} function autoSw(){if(ball.owner&&ball.owner.team===0&&ball.owner!==hp){hp.isHuman=false;hp=ball.owner;hp.isHuman=true;return;}var cl=hp,cd=dist(hp,ball);teams[0].forEach(function(p){var d=dist(p,ball);if(d<cd-35){cd=d;cl=p;}});if(cl!==hp){hp.isHuman=false;hp=cl;hp.isHuman=true;}} function procIn(){ var p=hp,dx=0,dy=0; if(keys['ArrowLeft']||keys['KeyA'])dx-=1;if(keys['ArrowRight']||keys['KeyD'])dx+=1; if(keys['ArrowUp']||keys['KeyW'])dy-=1;if(keys['ArrowDown']||keys['KeyS'])dy+=1; if(dx||dy){var n=norm(dx,dy);p.vx=n[0]*p.spd();p.vy=n[1]*p.spd();p.dir=Math.atan2(n[1],n[0]);} if(keys['Space']&&p.kcd===0){ if(ball.owner===p){var gx=PR+GD,gy=PCY+rnd(-GOAL_H*0.35,GOAL_H*0.35),s=norm(gx-p.x,gy-p.y);ball.owner=null;ball.vx=s[0]*SP;ball.vy=s[1]*SP;ball.lk=p;p.kcd=22;p.ta=8;spawnP(ball.x,ball.y,'#ffd700',8);} else if(!ball.owner&&dist(p,ball)<PR_+BR+18){ball.owner=p;p.kcd=10;} else if(ball.owner&&ball.owner.team!==p.team&&dist(p,ball)<PR_*2+12){if(Math.random()<0.6){ball.owner=null;ball.vx=rnd(-2,2);ball.vy=rnd(-2,2);spawnP(p.x,p.y,'#fff',6);}p.kcd=28;p.ta=12;} keys['Space']=false; } if((keys['ShiftLeft']||keys['ShiftRight'])&&p.kcd===0){ if(ball.owner===p){var m=nMate(p);if(m){var ms=norm(m.x-p.x,m.y-p.y);ball.owner=null;ball.vx=ms[0]*PP;ball.vy=ms[1]*PP;ball.lk=p;p.kcd=15;spawnP(ball.x,ball.y,'#74b9ff',5);}} keys['ShiftLeft']=false;keys['ShiftRight']=false; } } function aiTk(p){ var og=p.team===0?PR:PL,sp=p.spd(); if(ball.owner===p){ var gx=og+(p.team===0?-30:30);p.mvTo(gx,PCY,sp);p.dir=Math.atan2(PCY-p.y,gx-p.x); if(p.kcd===0&&dist(p,{x:og,y:PCY})<230&&Math.random()<0.03){var sc2=rnd(-GOAL_H*0.38,GOAL_H*0.38),ss=norm(og-p.x,PCY+sc2-p.y);ball.owner=null;ball.vx=ss[0]*SP*rnd(0.75,1);ball.vy=ss[1]*SP*rnd(0.75,1);ball.lk=p;p.kcd=30;p.ta=8;} if(p.kcd===0&&Math.random()<0.007){var m2=nMate(p);if(m2&&Math.abs(m2.x-og)<Math.abs(p.x-og)*0.85){var ms2=norm(m2.x-p.x,m2.y-p.y);ball.owner=null;ball.vx=ms2[0]*PP;ball.vy=ms2[1]*PP;ball.lk=p;p.kcd=20;}} return; } var ca=null,cd2=Infinity;teams[p.team].forEach(function(q){if(q.isHuman)return;var d=dist(q,ball);if(d<cd2){cd2=d;ca=q;}}); if(p===ca&&!ball.owner){p.mvTo(ball.x,ball.y,sp);if(p.kcd===0&&dist(p,ball)<PR_+BR+5){ball.owner=p;p.kcd=10;}} else if(ball.owner&&ball.owner.team!==p.team&&dist(p,ball)<85){p.mvTo(ball.x,ball.y,sp*0.9);if(p.kcd===0&&dist(p,ball)<PR_*2+8){if(Math.random()<0.38){ball.owner=null;ball.vx=rnd(-1.5,1.5);ball.vy=rnd(-1.5,1.5);p.ta=10;}p.kcd=30;}} else{var h2=p.home(),bx=lerp(h2.x,ball.x,0.22),by=lerp(h2.y,ball.y,0.22);p.mvTo(bx,by,sp*0.72);if(dist(p,{x:bx,y:by})<8){p.vx*=0.25;p.vy*=0.25;}} } function resPC(){var all=teams[0].concat(teams[1]);for(var i=0;i<all.length;i++)for(var j=i+1;j<all.length;j++){var a=all[i],b=all[j],d=dist(a,b),mn=PR_*2;if(d<mn&&d>0.01){var ov=(mn-d)/2,dx=(a.x-b.x)/d,dy=(a.y-b.y)/d;a.x+=dx*ov;a.y+=dy*ov;b.x-=dx*ov;b.y-=dy*ov;}}} function resBC(){if(ball.owner)return;var all=teams[0].concat(teams[1]);for(var i=0;i<all.length;i++){var p=all[i],d=dist(p,ball);if(d<PR_+BR){if(p.kcd===0){ball.owner=p;p.kcd=10;return;}var dx=(ball.x-p.x)/d,dy=(ball.y-p.y)/d;ball.x=p.x+dx*(PR_+BR+1);ball.y=p.y+dy*(PR_+BR+1);ball.vx+=dx*2;ball.vy+=dy*2;}}} function chkGoal(){if(ball.owner)return false;if(ball.x-BR<PL-GD+3&&ball.y>GTOP&&ball.y<GBOT){sc[1]++;gTeam=1;return true;}if(ball.x+BR>PR+GD-3&&ball.y>GTOP&&ball.y<GBOT){sc[0]++;gTeam=0;return true;}return false;} function updUI(){document.getElementById('scoreHome').textContent=sc[0];document.getElementById('scoreAway').textContent=sc[1];} function updTmr(){var r=Math.max(0,GT-gt);document.getElementById('timer').textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(Math.floor(r%60)).padStart(2,'0');} function drawGOvl(){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 72px monospace';ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=30;ctx.fillText('GOAL!',W/2,H/2-32);ctx.shadowBlur=0;ctx.font='bold 28px monospace';ctx.fillStyle=gTeam===0?'#ff6b6b':'#74b9ff';ctx.fillText(gTeam===0?'RED TEAM SCORES!':'BLUE TEAM SCORES!',W/2,H/2+32);} function drawEOvl(){ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 52px monospace';ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=20;ctx.fillText('FULL TIME!',W/2,H/2-110);ctx.shadowBlur=0;ctx.font='bold 76px monospace';ctx.fillStyle='#fff';ctx.fillText(sc[0]+' : '+sc[1],W/2,H/2-10);ctx.font='bold 30px monospace';ctx.fillStyle='#ffd700';ctx.fillText(sc[0]>sc[1]?'RED WINS!':sc[1]>sc[0]?'BLUE WINS!':'DRAW!',W/2,H/2+68);ctx.font='20px monospace';ctx.fillStyle='#aaa';ctx.fillText('Press ENTER or click to play again',W/2,H/2+130);} function drawKOvl(){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 36px monospace';ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=14;ctx.fillText(gt<1?'KICK OFF!':'GOAL KICK!',W/2,H/2-65);ctx.shadowBlur=0;} function drawPOvl(){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 52px monospace';ctx.fillStyle='#ffd700';ctx.fillText('PAUSED',W/2,H/2);ctx.font='20px monospace';ctx.fillStyle='#aaa';ctx.fillText('Press P to resume',W/2,H/2+55);} function drawFl(){if(ft<=0)return;var a=(ft/60)*0.45;ctx.fillStyle=gTeam===0?'rgba(255,80,80,'+a+')':'rgba(80,130,255,'+a+')';ctx.fillRect(0,0,W,H);ft--;} function drawMM(){var mx=12,my=H-75,mw=120,mh=62;ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(mx,my,mw,mh);ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);ctx.fillStyle='rgba(45,138,78,0.75)';ctx.fillRect(mx+2,my+2,mw-4,mh-4);ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.moveTo(mx+mw/2,my+2);ctx.li
